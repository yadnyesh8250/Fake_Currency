services:
  - type: web
    name: rupeevision
    runtime: python
    region: singapore
    plan: free
    rootDir: RupeeVision
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
